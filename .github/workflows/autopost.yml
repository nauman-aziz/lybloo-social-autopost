name: Lybloo autopost

on:
  schedule:
    # 10:00 and 22:00 Pakistan time (UTC+5)
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only, do not post'
        type: boolean
        default: true
      format:
        description: 'Feed format (auto alternates Reel and carousel)'
        type: choice
        options: [auto, reel, carousel]
        default: auto
      tiktok_test:
        description: 'Only send a TikTok draft of the latest product (posts nothing else)'
        type: boolean
        default: false
      tiktok_code:
        description: 'One-time TikTok code from the connect page (connects TikTok, posts nothing)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: autopost

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Connect TikTok
        if: inputs.tiktok_code != ''
        run: |
          echo "::add-mask::$CODE"
          node tiktok.mjs connect "$CODE"
        env:
          CODE: ${{ inputs.tiktok_code }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      - name: Post next product
        if: inputs.tiktok_code == ''
        run: node post.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TIKTOK_TEST: ${{ inputs.tiktok_test && '1' || '0' }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          FORMAT: ${{ inputs.format != 'auto' && inputs.format || '' }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CATALOG_ID: ${{ secrets.CATALOG_ID }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      - name: Save posted list
        if: always()
        run: |
          git config user.name "lybloo-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add posted.json docs $(ls tiktok-state.enc 2>/dev/null)
          git diff --cached --quiet || (git commit -m "Record posted product" && git push)
      # TikTok pulls photos from the verified GitHub Pages URL, so they have to be published (the
      # push above) before the post is sent.
      - name: Send TikTok photo post
        if: always() && hashFiles('tiktok-pending.json') != ''
        run: node tiktok.mjs send-pending
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      - name: Save TikTok status
        if: always() && hashFiles('tiktok-pending.json') == '' && hashFiles('tiktok-state.enc') != ''
        run: |
          git add -A posted.json docs tiktok-state.enc
          git diff --cached --quiet || (git commit -m "Record TikTok post" && git pull --rebase && git push)
