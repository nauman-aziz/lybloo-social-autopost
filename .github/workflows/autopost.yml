name: Lybloo autopost

on:
  schedule:
    # 10:00 and 22:00 Pakistan time (UTC+5)
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only, do not post'
        type: boolean
        default: true
      format:
        description: 'Feed format (auto alternates Reel and carousel)'
        type: choice
        options: [auto, reel, carousel]
        default: auto

permissions:
  contents: write

concurrency:
  group: autopost

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Post next product
        run: node post.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORMAT: ${{ inputs.format != 'auto' && inputs.format || '' }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CATALOG_ID: ${{ secrets.CATALOG_ID }}
      - name: Save posted list
        if: always()
        run: |
          git config user.name "lybloo-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add posted.json docs
          git diff --cached --quiet || (git commit -m "Record posted product" && git push)
