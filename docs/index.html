<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop our Instagram · Lybloo</title>
  <meta name="description" content="Tap any product from our Instagram posts to shop it on Lybloo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #0066cc; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --accent: #2997ff; } }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--muted); margin-top: 6px; font-size: 15px; }
    .shop { display: inline-block; margin-top: 16px; padding: 10px 22px; border-radius: 980px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    .tile { display: flex; flex-direction: column; background: var(--card); border-radius: 18px; overflow: hidden; color: inherit; text-decoration: none; }
    .frame { aspect-ratio: 1; background: #fff; display: block; }
    .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .name { padding: 12px 12px 0; font-size: 14px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price { padding: 4px 12px 14px; font-size: 14px; color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Shop our Instagram</h1>
      <p>Tap a product from our posts to see it on Lybloo.</p>
      <a class="shop" href="https://lybloo.com?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=link_in_bio">Visit lybloo.com</a>
    </header>
    <div class="grid">
      <a class="tile" href="https://lybloo.com/products/belkin-boostcharge-45w-compact-usb-c-charger?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=link_in_bio">
        <span class="frame"><img src="https://cdn.shopify.com/s/files/1/0808/8469/5271/files/belkin-boostcharge-45w-compact-usb-c-charger-1.jpg?v=1793286214&amp;format=pjpg&amp;width=600" alt="Belkin BoostCharge 45W Compact USB-C Charger" loading="lazy"></span>
        <span class="name">Belkin BoostCharge 45W Compact USB-C Charger</span>
        <span class="price">Rs 5,999</span>
      </a>
      <a class="tile" href="https://lybloo.com/products/motorola-turbopower-125w-charger-adapter?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=link_in_bio">
        <span class="frame"><img src="https://cdn.shopify.com/s/files/1/0808/8469/5271/files/motorola-turbopower-125w-charger-adapter-1.jpg?v=1793286224&amp;format=pjpg&amp;width=600" alt="Motorola TurboPower 125W USB-C Charger — Adapter Only" loading="lazy"></span>
        <span class="name">Motorola TurboPower 125W USB-C Charger — Adapter Only</span>
        <span class="price">Rs 6,000</span>
      </a>
    </div>
  </main>
</body>
</html>
